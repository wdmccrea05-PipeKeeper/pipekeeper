name: Full Release Regression Gate
on:
  pull_request:
    paths:
      - 'src/**'
      - 'base44/functions/**'
      - 'scripts/i18n-check.js'
      - 'docs/i18n/auditConfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/full-release-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-release-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check translation budget without relaxing the baseline
        run: npm run i18n:check -- --max-findings=2666
      - name: Run complete regression suite
        run: npm test -- --run
      - name: Build production assets
        run: npm run build
